<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Health Career Pathway – Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#F2F5F9;--surface:#fff;--ink:#0B1F3A;--muted:#475972;--line:#C9D3E0;--brand:#005EB8;--brand-dark:#003087;--ok:#00703C;--warn:#8A4B00;--warn-bg:#FFF3D6;--danger:#B3261E;--focus:#FFB81C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
header.top{background:var(--brand-dark);color:#fff;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header.top h1{font-size:1.15rem;margin:0}
header.top .who{font-size:.9rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:700;background:#E8EEF7;color:var(--brand-dark)}
.badge.role{background:#fff;color:var(--brand-dark)}
.badge.live{background:#D9F2E3;color:var(--ok)}.badge.pending{background:var(--warn-bg);color:var(--warn)}
.badge.closed,.badge.removed,.badge.rejected{background:#EBEBEB;color:#333}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
main{max-width:1000px;margin:0 auto;padding:16px}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
nav.tabs button{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}
nav.tabs button[aria-selected=true]{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
button,.btn{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600}
.btn.ghost{background:#fff;color:var(--brand)}
.btn.danger{background:#fff;color:var(--danger);border-color:var(--danger)}
.btn.small{padding:4px 10px;font-size:.9rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:1.05rem}
.meta{color:var(--muted);font-size:.92rem;display:flex;flex-wrap:wrap;gap:4px 14px;margin:4px 0 8px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #6b7c93;border-radius:8px;background:#fff;color:var(--ink);width:100%}
.toolbar input[type=search]{flex:1;min-width:200px;width:auto}
label{display:block;font-weight:600;margin:10px 0 3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
dialog{border:none;border-radius:14px;padding:18px;max-width:720px;width:calc(100% - 24px);box-shadow:0 10px 40px rgba(0,0,0,.3)}
.stepbar{display:flex;gap:6px;margin:4px 0 10px}.stepbar span{flex:1;height:6px;border-radius:3px;background:var(--line)}.stepbar span.on{background:var(--brand)}.step{display:none}.step.show{display:block}.rev{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;margin:8px 0}.rev dt{color:var(--muted)}.rev dd{margin:0;overflow-wrap:anywhere}
dialog::backdrop{background:rgba(11,31,58,.55)}
.hint{color:var(--muted);font-size:.88rem;font-weight:400}
.empty{padding:28px;text-align:center;color:var(--muted)}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:.93rem}
th{background:#E8EEF7}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;max-width:92%;display:none;z-index:50}
#toast.err{background:var(--danger)}
.center{max-width:440px;margin:60px auto;padding:0 16px}
.note{background:#E8EEF7;border-radius:10px;padding:10px 14px;font-size:.92rem;margin-bottom:12px}

/* ---- dashboard layout ---- */
body{background:#EEF2F7}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside.side{background:linear-gradient(180deg,#00205B,#003087);color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center}.brand strong{display:block;font-size:1rem;line-height:1.2}.brand small{opacity:.75}
.logo{width:36px;height:36px;border-radius:10px;background:#fff;color:#005EB8;display:grid;place-items:center;font-weight:800;font-size:1.4rem}
aside nav.tabs{flex-direction:column;gap:4px;margin:0}
aside nav.tabs button{background:transparent;border:0;color:#DCE6F5;text-align:left;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px}
aside nav.tabs button:hover{background:rgba(255,255,255,.1)}
aside nav.tabs button[aria-selected=true]{background:#fff;color:#003087}
aside nav.tabs .n{font-size:.8rem;background:rgba(255,255,255,.18);border-radius:99px;padding:1px 9px;font-weight:700}
aside nav.tabs button[aria-selected=true] .n{background:#E8EEF7}
.online{font-size:.84rem}#online{margin-top:auto}.ol{display:flex;gap:8px;align-items:center;margin:4px 0;overflow-wrap:anywhere}.av{position:relative;flex:none;width:26px;height:26px;border-radius:50%;background:#fff;color:#003087;display:grid;place-items:center;font-weight:800;font-size:.8rem}.av i{position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:#3DD68C;border:2px solid #003087}
.me{margin-top:14px;font-size:.86rem;display:flex;flex-direction:column;gap:8px;overflow-wrap:anywhere;border-top:1px solid rgba(255,255,255,.2);padding-top:12px}
.me .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.shell main{max-width:1180px;width:100%;margin:0;padding:22px 26px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pagehead h1{margin:0;font-size:1.5rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;cursor:pointer;border-left:5px solid var(--brand);box-shadow:0 1px 2px rgba(11,31,58,.05)}
.stat:hover{box-shadow:0 4px 14px rgba(11,31,58,.12)}
.stat .num{font-size:2rem;font-weight:800;line-height:1.1;display:block}
.stat .lbl{font-weight:600;display:block}.stat .sub{color:var(--muted);font-size:.84rem}
.stat.warn{border-left-color:#ED8B00}.stat.ok{border-left-color:var(--ok)}.stat.grey{border-left-color:#768692}
.stat[aria-pressed=true]{outline:2px solid var(--brand)}
.tablewrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(11,31,58,.05)}
.tablewrap table{border:0;border-radius:0}
.tablewrap th{background:#F5F8FC;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tablewrap tr:hover td{background:#FAFCFF}
.tablewrap td .t{font-weight:700}.tablewrap td .s{color:var(--muted);font-size:.86rem}
td.act{white-space:nowrap}td.act .btn{margin:0 4px 4px 0}
.toolbar select{width:auto}
.center.card{box-shadow:0 10px 30px rgba(11,31,58,.12);border-radius:16px;padding:24px}
@media(max-width:900px){
 .shell{grid-template-columns:1fr}aside.side{position:static;height:auto;padding:12px}
 aside nav.tabs{flex-direction:row;flex-wrap:wrap}.me{flex-direction:row;align-items:center;flex-wrap:wrap;margin-top:0}
 .shell main{padding:14px}.stats{grid-template-columns:1fr 1fr}
 .tablewrap thead{display:none}.tablewrap tr{display:block;padding:10px 12px;border-bottom:1px solid var(--line)}
 .tablewrap td{display:block;border:0;padding:2px 0}.tablewrap td[data-l]::before{content:attr(data-l)": ";color:var(--muted);font-size:.82rem}
}

/* ---- feedback animations ---- */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.97)}100%{transform:scale(1)}}
@keyframes bar{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:8px}
.loading{padding:40px;text-align:center;color:var(--muted)}
.btn{transition:transform .08s,box-shadow .15s,background .15s}.btn:active{transform:scale(.96)}
.btn.busy{position:relative;color:transparent!important;pointer-events:none}
.btn.busy::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border:2.5px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite}
.btn.ghost.busy::after{border-color:var(--brand);border-top-color:transparent}
.btn.danger.busy::after{border-color:var(--danger);border-top-color:transparent}
.stat{transition:transform .12s,box-shadow .15s}.stat:active{transform:scale(.97)}
.tablewrap tbody tr{animation:fadein .25s both}
#panel{animation:fadein .2s both}
body.loading-data::before{content:"";position:fixed;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,transparent,var(--brand),transparent);animation:bar 1s linear infinite;z-index:60}
#toast{animation:pop .15s both}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.filters label{margin:0;font-size:.8rem;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:2px}
.filters select,.filters input{width:auto;min-width:130px;padding:6px 8px}
.filters input[type=search]{min-width:220px;flex:1}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.spin,.btn.busy::after{animation:spin 1.5s linear infinite!important}}

/* ---- match the public guide: Atkinson font, navy masthead, same palette, pills, dark mode ---- */
:root{--font:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;--bg:#F2F5F9;--surface:#fff;--ink:#0B1F3A;--muted:#475972;--line:#C9D3E0;--brand:#005EB8;--brand-dark:#003087;--check-line:#475972;--group-bg:#E4ECF6;--open-bg:#D9ECFB;--open-ink:#003A75;--soon-bg:#FFB81C;--soon-ink:#1A1300;--closed-bg:#E3E6EA;--closed-ink:#3B4350;--new:#7A3FF2;--head-bg:#003087;--head-muted:#C8D6EE;--danger:#B3261E;--ok:#00703C}
@media(prefers-color-scheme:dark){:root{--bg:#0A1424;--surface:#111F35;--ink:#E8EEF7;--muted:#A9B8CE;--line:#2B3D58;--brand:#6BB2F2;--brand-dark:#9CCBF7;--check-line:#A9B8CE;--group-bg:#16294A;--open-bg:#173A66;--open-ink:#D6EAFF;--closed-bg:#2A3340;--closed-ink:#C3CBD6;--head-bg:#0D2A5C;--head-muted:#BCD0EE;--danger:#FF8A80;--ok:#7FD6A4;color-scheme:dark}}
body{font-family:var(--font);font-size:17px;background:var(--bg);color:var(--ink)}
a{color:var(--brand-dark)}
.masthead{background:var(--head-bg);color:#fff;padding:14px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.masthead h1{margin:0;font-size:clamp(1.3rem,3.5vw,1.75rem);line-height:1.15}
.masthead p{margin:2px 0 0;color:var(--head-muted);font-size:.95rem}
.masthead .who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.95rem}
.masthead .badge{background:#fff;color:#003087}
.masthead .btn.ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.55)}
.shell{display:block;min-height:0}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:0;max-width:1320px;margin:0 auto;align-items:start}
aside.side{background:transparent;color:var(--ink);position:sticky;top:0;height:auto;max-height:100vh;overflow-y:auto;padding:20px 0 20px 16px}
aside.side nav.tabs{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;gap:4px}
aside.side nav.tabs button{color:var(--ink);font-weight:700;min-height:46px;border-radius:8px}
aside.side nav.tabs button:hover{background:var(--group-bg)}
aside.side nav.tabs button[aria-selected=true]{background:var(--brand);color:#fff;box-shadow:inset 5px 0 0 var(--new)}
@media(prefers-color-scheme:dark){aside.side nav.tabs button[aria-selected=true]{color:#06182E}}
aside.side nav.tabs .n{background:var(--group-bg);color:var(--ink)}
aside.side nav.tabs button[aria-selected=true] .n{background:rgba(255,255,255,.25);color:inherit}
.online{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:14px;color:var(--ink)}
.online .hint{color:var(--muted)!important}
.av{background:var(--brand);color:#fff}.av i{border-color:var(--surface)}
#online:empty{display:none}
.shell main{padding:20px 16px 40px 22px;max-width:none}
.pagehead h1{font-size:1.6rem}
.stat,.card,.filters,.tablewrap,table,.note{background:var(--surface);border-radius:10px;border-color:var(--line);color:var(--ink)}
.note{background:var(--group-bg);border:0}
.stat{border-left-width:6px;border-left-color:var(--brand);box-shadow:none;font:inherit}
.stat.ok{border-left-color:var(--brand)}.stat.warn{border-left-color:var(--soon-bg)}.stat.grey{border-left-color:#768692}
.stat:has(.sub):first-child{border-left-color:var(--new)}
.stat .lbl{color:var(--ink)}.stat .sub{color:var(--muted)}
.stat[aria-pressed=true]{outline:3px solid var(--new);outline-offset:0}
.tablewrap th,th{background:var(--group-bg);color:var(--muted)}
.tablewrap tr:hover td{background:var(--group-bg)}
th,td{border-bottom-color:var(--line)}
input,select,textarea{background:var(--bg);color:var(--ink);border:2px solid var(--check-line);border-radius:8px;min-height:46px;padding:9px 12px}
textarea{min-height:0}
.filters label{color:var(--ink);font-weight:700;font-size:.9rem}
.btn{min-height:44px;padding:8px 16px;border-radius:8px;border:2px solid var(--brand);background:var(--brand);color:#fff}
@media(prefers-color-scheme:dark){.btn{color:#06182E}}
.btn.small{min-height:40px;padding:6px 12px}
.btn.ghost{background:var(--surface);color:var(--brand-dark);border-color:var(--brand)}
.btn.danger{background:var(--surface);color:var(--danger);border-color:var(--danger)}
.badge{background:var(--closed-bg);color:var(--closed-ink);font-weight:700;padding:3px 11px}
.badge.live{background:var(--open-bg);color:var(--open-ink)}
.badge.pending,.badge.warn{background:var(--soon-bg);color:var(--soon-ink)}
.badge.closed,.badge.removed,.badge.rejected{background:var(--closed-bg);color:var(--closed-ink)}
.badge.role{background:#fff;color:#003087}
dialog{background:var(--surface);color:var(--ink);border-radius:16px}
.stepbar span{background:var(--line)}.stepbar span.on{background:var(--new)}
.center.card{margin-top:40px}
.center .brand{color:var(--brand-dark)!important}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #FFB81C}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside.side{position:static;max-height:none;padding:12px 16px 0}aside.side nav.tabs{flex-direction:row;flex-wrap:wrap}.shell main{padding:14px 16px 30px}}
</style>

<body>
<div id="app"><div class="loading"><span class="spin"></span>Loading…</div></div>
<div id="toast" role="status" aria-live="polite"></div>

<dialog id="jobDlg" aria-labelledby="jobDlgTitle">
  <form id="jobForm" novalidate>
    <h2 id="jobDlgTitle" style="margin-top:0">Job</h2>
    <input type="hidden" id="f_id">
    <div class="stepbar" id="stepbar" aria-live="polite"></div>
    <div class="step" data-step="0"><h3>1. The basics</h3>
      <label for="f_title">Job title *</label><input id="f_title" required>
      <label for="f_url">Advert link (https) *</label><input id="f_url" type="url" placeholder="https://www.jobs.nhs.uk/candidate/jobadvert/…" required>
      <div class="grid"><div><label for="f_employer">Employer</label><select id="f_employer"></select></div>
      <div><label for="f_kind">Type *</label><select id="f_kind"></select></div></div></div>
    <div class="step" data-step="1"><h3>2. Pay and place</h3><div class="grid">
      <div><label for="f_category">Clinical or non-clinical</label><select id="f_category"></select></div>
      <div><label for="f_dept">Department</label><select id="f_dept"></select></div>
      <div><label for="f_band">Band</label><select id="f_band"></select></div>
      <div><label for="f_salary">Salary</label><input id="f_salary" placeholder="£25,272 or £25,760 – £27,476"></div>
      <div><label for="f_area">Area</label><select id="f_area"></select></div>
      <div><label for="f_location">Where</label><input id="f_location" placeholder="Birmingham B24 9SA"></div>
      <div><label for="f_hours">Hours</label><select id="f_hours"></select></div></div></div>
    <div class="step" data-step="2"><h3>3. Dates and apprenticeship</h3><div class="grid">
      <div><label for="f_posted">Date posted</label><input id="f_posted" type="date"></div>
      <div><label for="f_closes">Closing date</label><input id="f_closes" type="date"></div>
      <div><label for="f_app">Apprenticeship?</label><select id="f_app"></select></div></div></div>
    <div class="step" data-step="3"><h3>4. The details</h3>
      <label for="f_req">What you need <span class="hint">(one point per line)</span></label><textarea id="f_req" rows="4"></textarea>
      <label for="f_duties">What you'll do <span class="hint">(one point per line)</span></label><textarea id="f_duties" rows="4"></textarea>
      <label for="f_notes">Internal notes <span class="hint">(not shown on the site)</span></label><textarea id="f_notes" rows="2"></textarea></div>
    <div class="step" data-step="4"><h3>5. Check and confirm</h3><div id="reviewBox"></div>
      <p class="note" id="publishRow" style="margin:10px 0 0"><strong>This is the final check.</strong> When you confirm, the job goes live on the public site straight away.</p></div>
    <p id="formErr" role="alert" style="color:var(--danger);margin:8px 0 0"></p>
    <div class="actions" style="justify-content:space-between">
      <button type="button" class="btn danger" id="jobCancel">Cancel</button>
      <span style="display:flex;gap:8px"><button type="button" class="btn ghost" id="jobBack">Back</button>
      <button type="submit" class="btn" id="jobSave">Next</button></span>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL = 'https://fqcdlzwkfeswlexsatpx.supabase.co';
const SB_KEY = 'sb_publishable_ulBLm9a9fR24_HO9-ez4oA_tKhXJ9Sh';
const sb = supabase.createClient(SB_URL, SB_KEY);

const DEPTS = ["Admin, reception and secretaries","Wards and patient care","Imaging, tests and labs","Clinics, therapies and family support","Mental health and community teams","Theatres and decontamination","Catering, housekeeping and porters","Pharmacy and dental","Care homes and home care","Other"];
const AREAS = ["Sandwell","Birmingham","Dudley","Walsall","Wolverhampton","Check area"];
const KINDS = ["NHS","Care homes and others","Apprenticeships"];
const KIND_LABEL = {"NHS":"NHS","Care homes and others":"Care homes and others","Apprenticeships":"Apprenticeship"};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = {email:null, role:null}, jobs = [], team = [], logs = [], tab = 'live', q = '', startedFor = null;
const canEdit = () => me.role === 'admin' || me.role === 'editor';
const isAdmin = () => me.role === 'admin';

document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('.btn'); if(!b || b.disabled || b.classList.contains('busy')) return;
  if(['jobCancel','jobBack','codeBack'].includes(b.id)) return; b.classList.add('busy'); setTimeout(()=>b.classList.remove('busy'), 700); });
async function busy(btn, fn){ btn.classList.add('busy'); btn.disabled = true; try{ return await fn(); } finally { btn.classList.remove('busy'); btn.disabled = false; } }
function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className=err?'err':''; t.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display='none', err?7000:3500); }
function friendly(e){
  if(!e) return 'Something went wrong.';
  if(e.code==='42501') return "You don't have permission to do that.";
  if(e.code==='23505') return 'That already exists (the advert link or email is already in the list).';
  if(e.code==='P0001' || /last active admin/i.test(e.message||'')) return e.message.replace(/^.*?:\s*/,'');
  return e.message || 'Something went wrong.';
}
const fmtDate = s => { if(!s) return ''; const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); };
const fmtTime = s => new Date(s).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const daysLeft = s => s ? Math.round((new Date(s+'T00:00:00') - new Date(todayStr()+'T00:00:00'))/86400000) : null;
const lines = s => (s||'').split('\n').map(x=>x.replace(/^[•\-\s]+/,'').trim()).filter(Boolean);

/* ---------- auth ---------- */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  sb.auth.onAuthStateChange((ev, s) => { if(ev==='SIGNED_OUT'){ stopPresence(); start(null); } else if(ev==='SIGNED_IN') start(s); });
  start(session);
}
async function start(session){
  const uid = session?.user?.id || null;
  if(uid && uid === startedFor) return;
  startedFor = uid;
  if(!session){ me = {email:null, role:null}; return showLogin(); }
  me.email = session.user.email;
  $('#app').innerHTML = '<div class="loading"><span class="spin"></span>Checking your access…</div>';
  const { data, error } = await sb.rpc('current_app_role');
  if(error){ toast(friendly(error), true); }
  me.role = data || null;
  if(!me.role) return showNoAccess();
  await Promise.all([loadJobs(), isAdmin()?loadTeam():0, isAdmin()?loadLogs():0]);
  tab = jobs.some(j=>j.status==='pending') ? 'pending' : 'live'; render();
}
function showLogin(){
  $('#app').innerHTML = `<header class="masthead"><div><h1>Health Career Pathway</h1><p>Admin sign-in</p></div></header><div class="center card">
  <form id="loginForm"><p>Sign in with your work email. We'll email you a code – no password needed.</p>
  <label for="em">Email address</label><input id="em" type="email" autocomplete="email" required>
  <div class="actions"><button class="btn" id="loginBtn" type="submit">Email me a code</button></div></form>
  <form id="codeForm" style="display:none"><p id="codeInfo"></p>
  <label for="code">Code from the email</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required>
  <div class="actions"><button class="btn" id="codeBtn" type="submit">Sign in</button><button class="btn ghost" id="codeBack" type="button">Use a different email</button></div></form>
  <p id="loginMsg" role="status" style="margin-bottom:0"></p></div>`;
  const msg = (t, bad) => { $('#loginMsg').textContent = t; $('#loginMsg').style.color = bad ? 'var(--danger)' : 'var(--ok)'; };
  let em = '';
  $('#loginForm').onsubmit = async e => {
    e.preventDefault(); em = $('#em').value.trim().toLowerCase(); const b=$('#loginBtn'); msg('');
    const { error } = await busy(b, () => sb.auth.signInWithOtp({ email: em, options: { shouldCreateUser: true } }));
    if(error) return msg(friendly(error), true);
    $('#loginForm').style.display='none'; $('#codeForm').style.display='block';
    $('#codeInfo').textContent = 'We sent a code to '+em+'. It can take a minute – also check junk mail.';
    $('#code').focus();
  };
  $('#codeBack').onclick = () => { $('#codeForm').style.display='none'; $('#loginForm').style.display='block'; msg(''); };
  $('#codeForm').onsubmit = async e => {
    e.preventDefault(); const b=$('#codeBtn'); msg('');
    const { error } = await busy(b, () => sb.auth.verifyOtp({ email: em, token: $('#code').value.replace(/\s/g,''), type: 'email' }));
    if(error) msg('That code did not work. Check it, or go back and ask for a new one.', true);
  };
}
function showNoAccess(){
  $('#app').innerHTML = `<div class="center card"><h1 style="margin-top:0;font-size:1.3rem">No access yet</h1>
  <p>You're signed in as <strong>${esc(me.email)}</strong>, but that address isn't on the team. Ask an Admin to add you on the Team page, then sign in again.</p>
  <div class="actions"><button class="btn ghost" id="so">Sign out</button></div></div>`;
  $('#so').onclick = () => sb.auth.signOut();
}

/* ---------- data ---------- */
async function loadJobs(){ document.body.classList.add('loading-data'); const { data, error } = await sb.from('jobs').select('*').order('updated_at',{ascending:false}).limit(1000); if(error) toast(friendly(error),true); jobs = data || []; document.body.classList.remove('loading-data'); }
async function loadTeam(){ const { data, error } = await sb.from('team_members').select('*').order('created_at'); if(error) toast(friendly(error),true); team = data || []; }
async function loadLogs(){ const { data, error } = await sb.from('activity_log').select('*').order('at',{ascending:false}).limit(150); if(error) toast(friendly(error),true); logs = data || []; }

/* ---------- render ---------- */
let presence = null, online = [];
function onlineHtml(){ const seen = new Set(); const list = online.filter(p=>p&&p.email&&!seen.has(p.email.toLowerCase())&&seen.add(p.email.toLowerCase()));
  if(!list.length) return '';
  return `<div class="online"><div class="hint" style="color:#B9CBE8;margin-bottom:6px">Online now (${list.length})</div>${list.map(p=>`<div class="ol"><span class="av">${esc((p.email||'?')[0].toUpperCase())}<i></i></span><span>${esc(p.email)}${p.email.toLowerCase()===(me.email||'').toLowerCase()?' (you)':''}</span></div>`).join('')}</div>`; }
function startPresence(){
  if(presence || !sb.channel) return;
  try{
    presence = sb.channel('admin-online', { config: { private: true, presence: { key: me.email } } });
    presence.on('presence', { event: 'sync' }, () => { online = Object.values(presence.presenceState()).map(a=>a[0]).filter(Boolean); const el=document.getElementById('online'); if(el) el.innerHTML = onlineHtml(); });
    presence.subscribe(async st => { if(st === 'SUBSCRIBED') await presence.track({ email: me.email, role: me.role }); });
  }catch(e){ presence = null; }
}
function stopPresence(){ try{ if(presence) sb.removeChannel(presence); }catch(e){} presence = null; online = []; }
const TITLES = { pending:['Review queue','New roles wait here. Check each against its advert (Band 2 or 3, no health qualification or licence needed, local area) before you approve it.'], live:['Live on site','These are the roles the public site shows. Roles past their closing date are hidden automatically.'], archive:['Archive','Closed, removed and rejected roles. Restore sends a role back to the review queue.'], team:['Team','Who can use this admin page.'], activity:['Activity','A record of who changed what.'] };
let soon7 = false, kindF = '', areaF = '', bandF = '', winF = '', sortF = 'default';
function render(){
  const closing = jobs.filter(j=>{ const d=daysLeft(j.closes); return j.status==='live' && d!==null && d>=0 && d<=7; }).length;
  const counts = { pending: jobs.filter(j=>j.status==='pending').length, live: jobs.filter(j=>j.status==='live').length, archive: jobs.filter(j=>['closed','removed','rejected'].includes(j.status)).length };
  const showQueue = counts.pending > 0 || tab === 'pending';
  const items = [...(showQueue?[['pending','Review queue',counts.pending]]:[]),['live','Live on site',counts.live],['archive','Archive',counts.archive]];
  if(isAdmin()) items.push(['team','Team',team.length],['activity','Activity','']);
  const isJobTab = ['pending','live','archive'].includes(tab);
  const stats = `<div class="stats">
   ${showQueue?`<button class="stat warn" data-go="pending" aria-pressed="${tab==='pending'}"><span class="num">${counts.pending}</span><span class="lbl">Waiting for review</span><span class="sub">Need a decision</span></button>`:`<button class="stat" data-go="live" aria-pressed="false"><span class="num">${jobs.length}</span><span class="lbl">All roles</span><span class="sub">Ever added</span></button>`}
   <button class="stat ok" data-go="live" aria-pressed="${tab==='live'&&!soon7}"><span class="num">${counts.live}</span><span class="lbl">Live on the site</span><span class="sub">Visible to the public</span></button>
   <button class="stat warn" data-go="closing" aria-pressed="${tab==='live'&&soon7}"><span class="num">${closing}</span><span class="lbl">Closing in 7 days</span><span class="sub">Live roles ending soon</span></button>
   <button class="stat grey" data-go="archive" aria-pressed="${tab==='archive'}"><span class="num">${counts.archive}</span><span class="lbl">Archived</span><span class="sub">Closed, removed, rejected</span></button></div>`;
  $('#app').innerHTML = `<div class="shell"><header class="masthead"><div><h1>Health Career Pathway</h1><p>Admin: add, edit and manage the jobs shown on the public guide</p></div>
    <div class="who"><span>${esc(me.email)}</span><span class="badge role">${esc(me.role)}</span><button class="btn ghost small" id="so">Sign out</button></div></header>
    <div class="layout"><aside class="side">
    <nav class="tabs" role="tablist" aria-label="Sections">${items.map(([k,l,n])=>`<button role="tab" aria-selected="${k===tab}" data-tab="${k}"><span>${l}</span>${n!==''?`<span class="n">${n}</span>`:''}</button>`).join('')}</nav>
    <div id="online">${onlineHtml()}</div></aside>
    <main><div class="pagehead"><div><h2 style="margin:0;font-size:1.5rem">${TITLES[tab][0]}</h2><p class="hint" style="margin:2px 0 0">${TITLES[tab][1]}</p></div>${canEdit()&&isJobTab?'<button class="btn" id="addJob">+ Add a job</button>':''}</div>
    ${isJobTab?stats:''}<div id="panel"></div></main></div></div>`;
  $('#so').onclick = () => { stopPresence(); sb.auth.signOut(); };
  startPresence();
  if($('#addJob')) $('#addJob').onclick = () => openJob(null);
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab=b.dataset.tab; soon7=false; render(); });
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { const g=b.dataset.go; soon7 = g==='closing'; tab = g==='closing'?'live':g; render(); });
  if(isJobTab) renderJobs(); else if(tab==='team') renderTeam(); else renderActivity();
}

const normUrl = u => (u||'').trim().toLowerCase().replace(/#.*$/,'').replace(/\/+$/,'');
function bandOf(j){ const m=/Band (\d)/.exec(j.band||''); return m && (m[1]==='2'||m[1]==='3') ? 'Band '+m[1] : 'Other'; }
function matches(j){ if(!q) return true; const s=(j.title+' '+(j.employer||'')+' '+(j.area||'')+' '+j.url+' '+(j.notes||'')).toLowerCase(); return s.includes(q.toLowerCase()); }
function renderJobs(){
  let list;
  if(tab==='pending') list = jobs.filter(j=>j.status==='pending').sort((a,b)=>b.created_at.localeCompare(a.created_at));
  else if(tab==='live') list = jobs.filter(j=>j.status==='live').sort((a,b)=>(a.closes||'9999').localeCompare(b.closes||'9999'));
  else list = jobs.filter(j=>['closed','removed','rejected'].includes(j.status));
  if(soon7 && tab==='live') list = list.filter(j=>{ const d=daysLeft(j.closes); return d!==null && d>=0 && d<=7; });
  if(winF){ list = list.filter(j=>{ const d=daysLeft(j.closes); return d!==null && d>=0 && d<=+winF; }); }
  if(kindF) list = list.filter(j=>j.kind===kindF);
  if(areaF) list = list.filter(j=>j.area===areaF);
  if(bandF) list = list.filter(j=>bandOf(j)===bandF);
  list = list.filter(matches);
  if(sortF==='closing') list.sort((a,b)=>(a.closes||'9999').localeCompare(b.closes||'9999'));
  else if(sortF==='newest') list.sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
  else if(sortF==='az') list.sort((a,b)=>a.title.localeCompare(b.title));
  const areaOpts = [...new Set([...AREAS, ...jobs.map(j=>j.area).filter(Boolean)])];
  const active = !!(kindF||areaF||bandF||winF||sortF!=='default'||q||soon7);
  const sel = (id, label, opts, cur) => `<label>${label}<select id="${id}">${opts.map(([v,t])=>`<option value="${esc(v)}"${cur===v?' selected':''}>${esc(t)}</option>`).join('')}</select></label>`;
  $('#panel').innerHTML = `<div class="filters"><label style="flex:1">Search<input type="search" id="q" placeholder="Title, employer, area…" aria-label="Search jobs" value="${esc(q)}"></label>
   ${sel('kindF','Type',[['','All types'],...KINDS.map(k=>[k,KIND_LABEL[k]])],kindF)}
   ${sel('areaF','Area',[['','All areas'],...areaOpts.map(a=>[a,a])],areaF)}
   ${sel('bandF','Band',[['','All bands'],['Band 2','Band 2'],['Band 3','Band 3'],['Other','Other / not stated']],bandF)}
   ${sel('winF','Closing',[['','Any time'],['3','Within 3 days'],['7','Within 7 days'],['14','Within 14 days']],winF)}
   ${sel('sortF','Sort by',[['default','Default'],['closing','Closing soonest'],['newest','Newest added'],['az','Title A–Z']],sortF)}
   ${active?'<button class="btn ghost small" id="clr" style="align-self:flex-end">Clear filters</button>':''}
   <span class="hint" style="align-self:flex-end">${list.length} role${list.length===1?'':'s'}</span></div>
  ${list.length ? `<div class="tablewrap"><table><thead><tr><th>Role</th><th>Type</th><th>Pay</th><th>Area</th><th>Closes</th><th>Status</th><th></th></tr></thead><tbody>${list.map(jobRow).join('')}</tbody></table></div>` : '<div class="empty card">Nothing here.</div>'}`;
  $('#q').oninput = e => { q = e.target.value; const pos=e.target.selectionStart; renderJobs(); const el=$('#q'); el.focus(); el.setSelectionRange(pos,pos); };
  [['kindF','kindF'],['areaF','areaF'],['bandF','bandF'],['winF','winF'],['sortF','sortF']].forEach(([id]) => { $('#'+id).onchange = e => { ({kindF:v=>kindF=v,areaF:v=>areaF=v,bandF:v=>bandF=v,winF:v=>winF=v,sortF:v=>sortF=v})[id](e.target.value); soon7 = false; render(); }; });
  if($('#clr')) $('#clr').onclick = () => { soon7=false; kindF=areaF=bandF=winF=''; sortF='default'; q=''; render(); };
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => jobAction(b.dataset.act, b.dataset.id, b));
}
function jobRow(j){
  const dl = daysLeft(j.closes);
  const expired = j.status==='live' && dl!==null && dl<0;
  const soon = j.status==='live' && dl!==null && dl>=0 && dl<=3;
  const acts = [];
  if(canEdit()){
    if(j.status==='pending') acts.push(['approve','Approve','btn'],['edit','Edit','btn ghost'],['reject','Reject','btn danger']);
    else if(j.status==='live') acts.push(['edit','Edit','btn ghost'],['close','Mark closed','btn ghost'],['remove','Remove','btn danger']);
    else acts.push(['restore','Restore','btn ghost']);
  }
  if(isAdmin() && ['closed','removed','rejected'].includes(j.status)) acts.push(['delete','Delete','btn danger']);
  return `<tr><td><span class="t">${esc(j.title)}</span><br><span class="s">${esc(j.employer||'')}</span><br><a class="s" href="${esc(j.url)}" target="_blank" rel="noopener noreferrer">Open the advert</a>${j.notes?`<br><span class="s">Note: ${esc(j.notes)}</span>`:''}</td>
   <td data-l="Type">${esc(KIND_LABEL[j.kind]||j.kind)}<br><span class="s">${esc(j.source)}</span></td>
   <td data-l="Pay">${esc(j.band||'')}<br><span class="s">${esc(j.salary||'')}</span></td>
   <td data-l="Area">${esc(j.area||'')}</td>
   <td data-l="Closes">${j.closes?esc(fmtDate(j.closes)):'<span class="s">no date</span>'}${soon?`<br><span class="badge warn">${dl===0?'today':dl+' day'+(dl>1?'s':'')+' left'}</span>`:''}</td>
   <td data-l="Status"><span class="badge ${j.status}">${esc(j.status)}</span>${expired?'<br><span class="badge warn">Past closing date</span>':''}${j.reviewed_by?`<br><span class="s">by ${esc(j.reviewed_by)}</span>`:''}</td>
   <td class="act">${acts.map(([a,l,c])=>`<button class="${c} small" data-act="${a}" data-id="${j.id}">${l}</button>`).join('')}</td></tr>`;
}
async function setStatus(id, status){
  const patch = { status };
  if(status==='live' || status==='rejected' || status==='closed' || status==='removed'){ patch.reviewed_by = me.email; patch.reviewed_at = new Date().toISOString(); }
  const { error } = await sb.from('jobs').update(patch).eq('id', id);
  if(error) return toast(friendly(error), true);
  await loadJobs(); if(isAdmin()) await loadLogs(); render();
}
async function jobAction(act, id, btn){
  const j = jobs.find(x=>x.id===id); if(!j) return;
  btn.disabled = true;
  try{
    if(act==='edit') return openJob(j);
    if(act==='approve'){ const dl=daysLeft(j.closes); if(dl!==null && dl<0 && !confirm('This role is past its closing date and will not show on the site. Approve anyway?')) return; return await setStatus(id,'live'); }
    if(act==='reject') return await setStatus(id,'rejected');
    if(act==='close') return await setStatus(id,'closed');
    if(act==='remove'){ if(!confirm('Remove “'+j.title+'” from the site?')) return; return await setStatus(id,'removed'); }
    if(act==='restore') return await setStatus(id,'pending');
    if(act==='delete'){ if(!confirm('Permanently delete “'+j.title+'”? This cannot be undone (it stays in the activity log).')) return;
      const { error } = await sb.from('jobs').delete().eq('id', id); if(error) return toast(friendly(error),true);
      await loadJobs(); if(isAdmin()) await loadLogs(); render(); }
  } finally { btn.disabled = false; }
}

/* ---------- add / edit dialog ---------- */
const OTHER='__other__';
const opt = (arr, cur) => { const list = (cur && !arr.includes(cur)) ? [...arr, cur] : arr;
  return list.map(v=>`<option${v===cur?' selected':''}>${esc(v)}</option>`).join('') + `<option value="${OTHER}">Other (type your own)…</option>`; };
function otherBox(id){ const sel=$('#f_'+id); let box=$('#o_'+id);
  if(!box){ box=document.createElement('input'); box.id='o_'+id; box.placeholder='Type your own'; box.setAttribute('aria-label','Other '+id); box.style.display='none'; box.style.marginTop='6px'; sel.after(box); }
  const sync=()=>{ box.style.display = sel.value===OTHER?'block':'none'; if(sel.value!==OTHER) box.value=''; };
  sel.onchange=sync; sync(); return box; }
const pick = id => { const sel=$('#f_'+id); return sel.value===OTHER ? $('#o_'+id).value.trim() : sel.value; };
function openJob(j){
  $('#jobDlgTitle').textContent = j ? 'Edit job' : 'Add a job';
  $('#f_kind').innerHTML = KINDS.map(k=>`<option value="${esc(k)}"${j&&j.kind===k?' selected':''}>${esc(KIND_LABEL[k])}</option>`).join('');
  $('#f_area').innerHTML = opt(AREAS, j?.area);
  $('#f_dept').innerHTML = opt(DEPTS, j?.dept);
  $('#f_category').innerHTML = opt(['Clinical','Non-clinical'], j?.category || 'Non-clinical');
  const BANDS=['Band 2','Band 2 (bank, hourly)','Band 3','Band 3 (bank, hourly)','Pay as advertised'];
  const HOURS=['Full-time, permanent','Part-time, permanent','Full-time, fixed term','Part-time, fixed term','Bank (flexible hours)'];
  const APPS=['No','Yes – Level 2','Yes – Level 3','Yes – Level 4'];
  const EMPS=[...new Set(jobs.map(x=>x.employer).filter(Boolean))].sort();
  $('#f_band').innerHTML = opt(BANDS, j?.band||''); $('#f_hours').innerHTML = opt(HOURS, j?.hours||'');
  $('#f_app').innerHTML = opt(APPS, j?.apprenticeship||'No'); $('#f_employer').innerHTML = opt(EMPS, j?.employer||'');
  ['area','dept','category','band','hours','app','employer'].forEach(otherBox);
  const set = (id,v) => $('#f_'+id).value = v ?? '';
  set('id', j?.id); set('title', j?.title); set('url', j?.url);
  set('salary', j?.salary); set('location', j?.location);
  set('posted', j?.posted); set('closes', j?.closes);
  set('req', (j?.requirements||[]).join('\n')); set('duties', (j?.duties||[]).join('\n')); set('notes', j?.notes);
  $('#publishRow').style.display = j ? 'none' : 'block';
  $('#formErr').textContent = '';
  goStep(0);
  $('#jobDlg').showModal();
}
$('#jobCancel').onclick = () => $('#jobDlg').close();
const LAST=4; let step=0;
const val = id => $('#f_'+id).value.trim();
function goStep(n){ step=n; document.querySelectorAll('#jobForm .step').forEach(el=>el.classList.toggle('show', +el.dataset.step===n));
  $('#stepbar').innerHTML=[0,1,2,3,4].map(i=>`<span class="${i<=n?'on':''}"></span>`).join('');
  $('#jobBack').style.display = n? '' : 'none';
  $('#jobSave').textContent = n===LAST ? ($('#f_id').value?'Confirm and save':'Confirm and add job') : 'Next';
  $('#publishRow').style.display = $('#f_id').value ? 'none':'block';
  if(n===LAST) renderReview(); $('#formErr').textContent='';
  const f=document.querySelector(`#jobForm .step[data-step="${n}"] input,#jobForm .step[data-step="${n}"] select,#jobForm .step[data-step="${n}"] textarea`); if(f) f.focus(); }
function checkStep(n){
  if(n===0){ if($('#f_employer').value===OTHER && !$('#o_employer').value.trim()) return 'Type the employer, or pick one from the list.'; if(!val('title')) return 'Add a job title.'; if(!/^https:\/\//i.test(val('url'))) return 'The advert link must start with https://'; }
  if(n===1){ for(const k of ['category','dept','area','band','hours','employer']) if($('#f_'+k).value===OTHER && !$('#o_'+k).value.trim()) return 'Type your own value, or pick one from the list.'; }
  if(n===2 && $('#f_app').value===OTHER && !$('#o_app').value.trim()) return 'Type your own value, or pick one from the list.';
  if(n===2 && val('posted') && val('closes') && val('closes') < val('posted')) return 'The closing date is before the posting date.';
  return '';
}
function renderReview(){
  const rows=[['Job title',val('title')],['Advert link',val('url')],['Employer',pick('employer')],['Type',$('#f_kind').selectedOptions[0]?.textContent],['Clinical / non-clinical',pick('category')],['Department',pick('dept')],['Band',pick('band')],['Salary',val('salary')],['Area',pick('area')],['Where',val('location')],['Hours',pick('hours')],['Posted',val('posted')],['Closes',val('closes')],['Apprenticeship',pick('app')],['What you need',val('req')],['What you\'ll do',val('duties')],['Internal notes',val('notes')]];
  $('#reviewBox').innerHTML='<p class="hint">Check everything below. Use Back to change anything.</p><dl class="rev">'+rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v?esc(v).replace(/\n/g,'<br>'):'<span class="hint">—</span>'}</dd>`).join('')+'</dl>'; }
$('#jobBack').onclick = () => goStep(step-1);
$('#jobForm').onsubmit = async e => {
  e.preventDefault();
  const err = m => { $('#formErr').textContent = m; };
  const m = checkStep(step); if(m) return err(m);
  if(step<LAST) return goStep(step+1);
  for(let i=0;i<LAST;i++){ const m2=checkStep(i); if(m2){ goStep(i); return err(m2); } }
  const v = val;
  const rec = { title:v('title'), employer:pick('employer')||null, url:v('url'), kind:$('#f_kind').value, category:pick('category')||null,
    band:pick('band')||null, salary:v('salary')||null, area:pick('area')||null, dept:pick('dept')||null, location:v('location')||null,
    hours:pick('hours')||null, posted:v('posted')||null, closes:v('closes')||null, apprenticeship:pick('app')||null,
    requirements:lines($('#f_req').value), duties:lines($('#f_duties').value), notes:v('notes')||null };
  const id = $('#f_id').value;
  const dup = jobs.find(x => x.id !== id && normUrl(x.url) === normUrl(rec.url));
  let restoreId = null;
  if(dup){
    if(['closed','removed','rejected'].includes(dup.status) && !id){
      if(!confirm('This advert is already in the Archive as “'+dup.title+'” ('+dup.status+').\n\nRestore it and replace it with the details you just entered? It will go live on the site.')) return;
      restoreId = dup.id;
    } else {
      return err('That advert is already '+(dup.status==='live'?'live on the site':dup.status==='pending'?'in the review queue':'in the Archive')+' as “'+dup.title+'”. Search for it in the list instead of adding it again.');
    }
  }
  const b = $('#jobSave'); b.disabled = true; b.classList.add('busy');
  const now = new Date().toISOString();
  let res;
  if(restoreId) res = await sb.from('jobs').update({ ...rec, status:'live', reviewed_by:me.email, reviewed_at:now }).eq('id', restoreId);
  else if(id) res = await sb.from('jobs').update(rec).eq('id', id);
  else res = await sb.from('jobs').insert({ ...rec, status:'live', source:'manual', created_by: me.email, reviewed_by: me.email, reviewed_at: now });
  b.disabled = false; b.classList.remove('busy');
  if(res.error) return err(friendly(res.error));
  $('#jobDlg').close(); toast(id?'Saved.':'Job added and live on the site.'); await loadJobs(); if(isAdmin()) await loadLogs(); render();
};

/* ---------- team (admins) ---------- */
function renderTeam(){
  $('#panel').innerHTML = `<div class="note"><strong>Admin</strong> can do everything, including adding people. <strong>Editor</strong> can add, edit, approve and remove jobs. <strong>Viewer</strong> can look but not change anything. Someone can only use this page if their email is listed here.</div>
  <table><thead><tr><th>Name / email</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>
  ${team.map(m=>`<tr><td><strong>${esc(m.display_name||'')}</strong><br>${esc(m.email)}</td>
   <td><select data-role="${m.id}" aria-label="Role for ${esc(m.email)}">${['admin','editor','viewer'].map(r=>`<option${m.role===r?' selected':''}>${r}</option>`).join('')}</select></td>
   <td>${m.active?'<span class="badge live">active</span>':'<span class="badge closed">switched off</span>'}<br><span class="hint">${m.user_id?'has signed in':'not signed in yet'}</span></td>
   <td><div class="actions" style="margin:0"><button class="btn ghost small" data-toggle="${m.id}">${m.active?'Switch off':'Switch on'}</button><button class="btn danger small" data-del="${m.id}">Remove</button></div></td></tr>`).join('')}
  </tbody></table>
  <div class="card" style="margin-top:14px"><h3>Add someone</h3><form id="addTeam" class="grid">
    <div><label for="t_email">Work email</label><input id="t_email" type="email" required></div>
    <div><label for="t_name">Name</label><input id="t_name"></div>
    <div><label for="t_role">Role</label><select id="t_role"><option>viewer</option><option selected>editor</option><option>admin</option></select></div>
    <div style="align-self:end"><button class="btn" type="submit">Add to team</button></div></form></div>`;
  document.querySelectorAll('[data-role]').forEach(s => s.onchange = async () => {
    const { error } = await sb.from('team_members').update({ role: s.value }).eq('id', s.dataset.role);
    if(error) toast(friendly(error), true); else toast('Role updated.');
    await loadTeam(); await loadLogs(); renderTeam();
  });
  document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
    const m = team.find(x=>x.id===b.dataset.toggle);
    const { error } = await sb.from('team_members').update({ active: !m.active }).eq('id', m.id);
    if(error) toast(friendly(error), true);
    await loadTeam(); await loadLogs(); renderTeam();
  });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const m = team.find(x=>x.id===b.dataset.del);
    if(!confirm('Remove '+m.email+' from the team?')) return;
    const { error } = await sb.from('team_members').delete().eq('id', m.id);
    if(error) toast(friendly(error), true); else toast('Removed.');
    await loadTeam(); await loadLogs(); renderTeam();
  });
  $('#addTeam').onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.from('team_members').insert({ email:$('#t_email').value.trim(), display_name:$('#t_name').value.trim()||null, role:$('#t_role').value, created_by: me.email });
    if(error) return toast(friendly(error), true);
    toast('Added. They can now sign in with that email.'); await loadTeam(); await loadLogs(); renderTeam();
  };
}

/* ---------- activity (admins) ---------- */
function summarise(l){
  const d = l.details || {}; const row = d.after || d;
  const name = row.title || row.email || l.entity_id || '';
  if(l.action==='update' && d.before && d.after){
    const ch = Object.keys(d.after).filter(k=>!['updated_at','reviewed_at'].includes(k) && JSON.stringify(d.before[k])!==JSON.stringify(d.after[k]));
    if(ch.includes('status')) return `${name}: status ${d.before.status} → ${d.after.status}`;
    return `${name}: changed ${ch.join(', ') || 'details'}`;
  }
  return name;
}
function renderActivity(){
  $('#panel').innerHTML = `<div class="note">The last 150 changes. Every add, edit, approval, removal and team change is recorded here.</div>
  <table><thead><tr><th>When</th><th>Who</th><th>What</th><th>Details</th></tr></thead><tbody>
  ${logs.map(l=>`<tr><td>${esc(fmtTime(l.at))}</td><td>${esc(l.actor_email||'')}</td><td>${esc(l.action)} ${esc(l.entity==='jobs'?'job':'team member')}</td><td>${esc(summarise(l))}</td></tr>`).join('') || '<tr><td colspan="4">No activity yet.</td></tr>'}
  </tbody></table>`;
}

boot();
</script>
